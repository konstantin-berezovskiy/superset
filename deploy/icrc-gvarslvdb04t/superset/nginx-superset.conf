# Superset reverse proxy. Certificate: /etc/pki/tls/certs/superset.crt (self-signed until the ICRC CA one is installed).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gvarslvdb04t.gva.icrc.priv gvarslvdb04t;
    return 301 https://gvarslvdb04t.gva.icrc.priv$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gvarslvdb04t.gva.icrc.priv gvarslvdb04t;

    ssl_certificate     /etc/pki/tls/certs/superset.crt;
    ssl_certificate_key /etc/pki/tls/private/superset.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # HSTS is sent by Superset (Talisman).
    client_max_body_size 100m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_read_timeout 300s;
    }

    # MCP server (streamable HTTP); requires a JWT from /opt/superset/mcp-token.sh
    location /mcp {
        proxy_pass http://127.0.0.1:5008/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
